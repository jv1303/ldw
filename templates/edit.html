{% extends "base.html" %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
    <h1>Editar Usuário</h1>

    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" value="{{ user.nome }}" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>

        <button type="submit" class="btn">Atualizar Usuário</button>
        <a href="{{ url_for('index') }}" class="btn btn-danger" style="margin-left: 10px;">Cancelar</a>
    </form>
{% endblock %}
