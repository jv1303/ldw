{% extends "base.html" %}

{% block title %}Lista de Usuários{% endblock %}

{% block content %}
    <h1>Lista de Usuários</h1>

    <a href="{{ url_for('create') }}" class="btn" style="margin-bottom: 20px;">➕ Novo Usuário</a>

    <ul>
    {% for user in users %}
        <li>
            <span class="user-info"><strong>{{ user.nome }}</strong> - {{ user.email }}</span>
            
            <div class="acoes">
                <a href="{{ url_for('edit', id=user.id) }}" class="btn">Editar</a>
                
                <form action="{{ url_for('delete', id=user.id) }}" method="POST" onsubmit="return confirm('Tem certeza que deseja deletar este usuário?');">
                    <button type="submit" class="btn btn-danger">Deletar</button>
                </form>
            </div>
        </li>
    {% else %}
        <li>Nenhum usuário cadastrado ainda.</li>
    {% endfor %}
    </ul>
{% endblock %}
