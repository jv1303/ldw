{% extends "base.html" %}
{% block title %}Inserir Usuário{% endblock %}
{% block content %}
    
    <div class="page-header">
        <h1>Adicionar Novo Usuário</h1>
        <a href="{{ url_for('menu') }}" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Menu
        </a>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: João da Silva">
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="Ex: joao@email.com">
            </div>
            
            <div style="margin-top: 30px;">
                <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Salvar no Banco</button>
            </div>
        </form>
    </div>
{% endblock %}
