{% extends "base.html" %}

{% block title %}Novo Usuário{% endblock %}

{% block content %}
    <h1>Adicionar Novo Usuário</h1>

    <form method="POST">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite o nome completo">
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="Digite o e-mail">
        </div>

        <button type="submit" class="btn">Salvar Usuário</button>
        <a href="{{ url_for('index') }}" class="btn btn-danger" style="margin-left: 10px;">Cancelar</a>
    </form>
{% endblock %}
